<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol - arabamız.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #0284c7 100%);
            background-attachment: fixed;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.4);
        }
        .glass-input {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #f8fafc;
            transition: all 0.3s ease;
        }
        .glass-input:focus {
            background: rgba(15, 23, 42, 0.7);
            border-color: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
            outline: none;
        }
    </style>
</head>
<body class="text-slate-200 font-sans min-h-screen flex items-center justify-center px-4">

    <div class="max-w-md w-full">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-black text-white tracking-wide">
                arabamız<span class="text-red-500">.</span>
            </h1>
            <p class="text-slate-400 text-xs mt-1.5 uppercase tracking-widest">Yeni Sürücü Kayıt Paneli</p>
        </div>

        <div class="glass-card rounded-3xl p-8 space-y-6">
            <div class="flex items-center gap-2.5 border-b border-slate-700/40 pb-4">
                <i class="fa-solid fa-user-plus text-emerald-400 text-xl"></i>
                <h2 class="text-lg font-bold text-white">Hesap Oluştur</h2>
            </div>

            <form id="secureRegisterForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold mb-1.5 text-slate-300 uppercase tracking-wider">Ad Soyad</label>
                    <input type="text" id="regName" required placeholder="Alihan Yılmaz" class="glass-input w-full rounded-xl px-4 py-3.5 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1.5 text-slate-300 uppercase tracking-wider">E-Posta Adresi</label>
                    <input type="email" id="regEmail" required placeholder="alihan76@gmail.com" class="glass-input w-full rounded-xl px-4 py-3.5 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1.5 text-slate-300 uppercase tracking-wider">Şifre</label>
                    <input type="password" id="regPassword" required placeholder="••••••••" class="glass-input w-full rounded-xl px-4 py-3.5 text-sm">
                </div>

                <button type="submit" class="w-full mt-2 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-emerald-500/20 transition-all duration-300 text-sm tracking-wide">
                    Kayıt Ol ve Katıl Kanka 🚀
                </button>
            </form>

            <div class="text-center border-t border-slate-700/40 pt-4">
                <p class="text-xs text-slate-400">
                    Zaten hesabın var mı? 
                    <a href="./login.html" class="text-sky-400 hover:underline font-bold ml-1">Giriş Yap</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('secureRegisterForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Backend'in (server.js) tam olarak beklediği isimlerle eşitledik kanka!
            const name_surname = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;

            try {
                const response = await fetch('https://arabamiz-projesi.onrender.com/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name_surname, email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    alert("🚀 Efsane kanka! Kaydın başarıyla veritabanına mühürlendi. Şimdi giriş yapabilirsin!");
                    window.location.href = './login.html';
                } else {
                    alert("❌ Kayıt Başarısız kanka: " + (data.error || "Bilinmeyen hata"));
                }
            } catch (err) {
                console.error(err);
                alert("Backend sunucusu şu an açık mı kanka? Terminali kontrol et.");
            }
        });
    </script>
</body>
</html>
