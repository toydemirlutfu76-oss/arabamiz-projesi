<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arabamız - Profesyonel Araç Platformu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Gelişmiş Cam Efekti kanka */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="bg-[#0f172a] text-slate-200 font-sans transition-colors duration-300" id="app-body">

    <div class="flex h-screen p-4 gap-4 overflow-hidden">
        
        <aside class="w-64 bg-[#1e293b] rounded-2xl p-4 flex flex-col justify-between shadow-xl border border-slate-800">
            <div>
                <div class="text-2xl font-black text-sky-400 mb-8 flex items-center gap-2 cursor-pointer tracking-wider" onclick="clearFilters(); navigate('vitrin')">
                    <i class="fa-solid fa-gauge-high text-sky-500"></i> arabamız<span class="text-white">.</span>
                </div>

                <div id="kullanici-profil-alani"></div>

                <nav class="space-y-1.5" id="sidebar-menu">
                    <button onclick="clearFilters(); navigate('vitrin', this)" class="menu-btn w-full text-left px-4 py-3 rounded-xl bg-sky-600 text-white font-semibold flex items-center gap-3 transition-all shadow-md">
                        <i class="fa-solid fa-table-cells-large"></i> Vitrin
                    </button>
                    
                    <button onclick="fetchOnlyFavorites(this)" class="menu-btn w-full text-left px-4 py-3 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-white font-medium flex items-center gap-3 transition-all mt-2">
                        <i class="fa-solid fa-heart text-rose-500"></i> Favori İlanlarım
                    </button>
                    
                    <button onclick="window.location.href='ilan-ver.html'" class="menu-btn w-full text-left px-4 py-3 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-white font-medium flex items-center gap-3 transition-all">
                        <i class="fa-solid fa-circle-plus text-emerald-500"></i> İlan Ver
                    </button>
                    <button onclick="window.location.href='gelen-teklif.html'" class="menu-btn w-full text-left px-4 py-3 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-white font-medium flex items-center gap-3 transition-all">
                        <i class="fa-solid fa-comments text-amber-500"></i> Gelen Teklifler
                    </button>
                    <button onclick="navigate('ilanlarim', this)" class="menu-btn w-full text-left px-4 py-3 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-white font-medium flex items-center gap-3 transition-all">
                        <i class="fa-solid fa-rectangle-list text-purple-500"></i> İlanlarım
                    </button>
                    <button onclick="navigate('ayarlar', this)" class="menu-btn w-full text-left px-4 py-3 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-white font-medium flex items-center gap-3 transition-all">
                        <i class="fa-solid fa-sliders text-blue-500"></i> Ayarlar
                    </button>
                </nav>
            </div>
            
            <button id="auth-action-btn" onclick="oturumuKapatKanka()" class="mt-auto flex items-center gap-2 text-red-400 hover:text-red-300 font-bold p-3 text-sm transition-all">
                <i class="fa-solid fa-right-from-bracket"></i> Oturumu Kapat kanka
            </button>
        </aside>

        <div class="flex-1 flex flex-col gap-4 overflow-hidden">
            
            <header class="bg-[#1e293b] p-4 rounded-2xl flex justify-between items-center shadow-lg border border-slate-800">
                <div class="relative flex-1 max-w-xl">
                    <input type="text" id="search-input" oninput="handleSearch(this.value)" placeholder="Marka veya model arayın... (Örn: BMW)" class="w-full bg-[#0f172a] text-white pl-4 pr-10 py-2.5 rounded-xl border border-slate-700 focus:outline-none focus:border-sky-500 text-sm transition-all">
                    <div class="absolute right-3 top-3 text-sky-400">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </div>
                </div>
                <button onclick="toggleTheme()" id="theme-toggle-btn" class="bg-[#0f172a] px-4 py-2.5 rounded-xl border border-slate-700 flex items-center gap-2 hover:bg-slate-800 transition text-sm font-medium shadow-sm">
                    <i class="fa-solid fa-moon text-amber-400"></i> <span>Koyu Tema</span>
                </button>
            </header>

            <main class="flex-1 bg-[#1e293b] rounded-2xl p-6 overflow-y-auto shadow-xl border border-slate-800" id="dynamic-content">
                </main>
        </div>

        <aside class="w-80 bg-[#1e293b] rounded-2xl p-4 shadow-xl border border-slate-800 flex flex-col gap-4 overflow-y-auto">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <div class="flex items-center gap-2 font-bold text-lg text-sky-400">
                    <i class="fa-solid fa-filter"></i> Detaylı Filtrele
                </div>
                <button onclick="clearFilters()" class="text-xs text-rose-400 hover:underline">Temizle</button>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Marka</label>
                    <select id="filter-brand" class="w-full bg-[#0f172a] border border-slate-700 rounded-xl p-2.5 text-sm focus:border-sky-500 focus:outline-none text-white">
                        <option value="all">Tümü</option>
                        <option value="BMW">BMW</option>
                        <option value="Mercedes">Mercedes</option>
                        <option value="Audi">Audi</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Maksimum Kilometre (KM)</label>
                    <input type="number" id="filter-km-max" placeholder="Örn: 100000" class="w-full bg-[#0f172a] border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:border-sky-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Maksimum Fiyat (TL)</label>
                    <input type="number" id="filter-price-max" placeholder="Örn: 2000000" class="w-full bg-[#0f172a] border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:border-sky-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Fuel Type</label>
                    <select id="filter-fuel" class="w-full bg-[#0f172a] border border-slate-700 rounded-xl p-2.5 text-sm focus:border-sky-500 focus:outline-none text-white">
                        <option value="all">Tümü</option>
                        <option value="Benzin">Benzin</option>
                        <option value="Dizel">Dizel</option>
                        <option value="Hibrit">Hibrit</option>
                        <option value="Elektrik">Elektrik</option>
                    </select>
                </div>
            </div>

            <button onclick="applyFilters()" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-semibold py-3 rounded-xl transition-all mt-auto flex items-center justify-center gap-2 shadow-md">
                <i class="fa-solid fa-sliders"></i> Sonuçları Filtrele
            </button>
        </aside>

    </div>

    <script>
        let allLiveCars = [];
        let filteredCars = []; 

        // 1. VERİTABANINDAN VERİLERİ ÇEKEN ANA FONKSİYON
        async function fetchCarsFromDatabase() {
            try {
                const response = await fetch('https://arabamiz-projesi.onrender.com');
                allLiveCars = await response.json();
                filteredCars = [...allLiveCars]; 
                
                console.log("Veritabanından başarıyla çekilen ilanlar kanka:", allLiveCars);
                
                navigate('vitrin');
            } catch (error) {
                console.error("Bağlantı hatası kanka:", error);
                document.getElementById('dynamic-content').innerHTML = `
                    <p class="text-red-400 text-center py-10">Sunucu kapalı veya veritabanı bağlantısı kurulamadı kanka!</p>
                `;
            }
        }

        // 2. SAYFA YÖNLENDİRME MOTORU
        function navigate(pageName, menuElement = null) {
            const container = document.getElementById('dynamic-content');
            if (!container) return;
            
            if (menuElement) {
                document.querySelectorAll('.menu-btn').forEach(btn => {
                    btn.classList.remove('bg-sky-600', 'text-white', 'font-semibold', 'shadow-md');
                    btn.classList.add('text-slate-400', 'hover:bg-slate-800', 'hover:text-white', 'font-medium');
                });
                menuElement.classList.remove('text-slate-400', 'hover:bg-slate-800', 'hover:text-white', 'font-medium');
                menuElement.classList.add('bg-sky-600', 'text-white', 'font-semibold', 'shadow-md');
            }

            if (pageName === 'vitrin') {
                renderVitrin(container);
            } else {
                renderStaticPages(pageName, container);
            }
        }

        // 3. CANLI VİTRİNİ ÇİZEN MOTOR (Tüm Değişkenler Senkronize kanka)
        function renderVitrin(container) {
            const currentUserId = localStorage.getItem('user_id') || localStorage.getItem('id');

            let html = `
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h2 class="text-2xl font-black tracking-tight text-white">Vitrindeki Canlı İlanlar</h2>
                        <p class="text-sm text-slate-400 mt-0.5">Veritabanından anlık çekilen gerçek araçlar.</p>
                    </div>
                    <span class="text-xs bg-[#0f172a] text-slate-400 px-3 py-1.5 rounded-full border border-slate-800">Toplam ${filteredCars.length} İlan</span>
                </div>
            `;

            if (filteredCars.length === 0) {
                html += `
                    <div class="text-center py-20 bg-[#0f172a] rounded-2xl border border-slate-800">
                        <i class="fa-solid fa-car-burst text-5xl text-slate-600 mb-3"></i>
                        <h3 class="text-lg font-bold text-slate-300">Aradığınız kriterde ilan bulunamadı kanka.</h3>
                        <p class="text-xs text-slate-500 mt-1">Lütfen sağ taraftaki filtreleri sıfırlayıp tekrar deneyin.</p>
                    </div>
                `;
            } else {
                html += `<div class="grid grid-cols-1 md:grid-cols-3 gap-6">`;
                filteredCars.forEach(car => {
                    
                    // --- SİLME BUTONU KONTROLÜ ---
                    const isOwner = parseInt(car.user_id) === parseInt(currentUserId);
                    const deleteButtonHtml = isOwner ? `
                        <button onclick="deleteSingleCar(${car.id})" class="absolute top-3 right-3 bg-rose-600/90 hover:bg-rose-500 text-white w-8 h-8 rounded-xl flex items-center justify-center transition shadow-lg shadow-rose-600/20 z-10" title="İlanı Sil">
                            <i class="fa-solid fa-trash-can text-xs"></i>
                        </button>
                    ` : '';

                    // --- FAVORİ KALP BUTONU KONTROLÜ ---
                    const kalpPozisyonu = isOwner ? 'left-3' : 'right-3';
                    const favoriler = JSON.parse(localStorage.getItem('my_favorites')) || [];
                    const isFav = favoriler.includes(car.id);
                    const kalpIkonClass = isFav ? 'fa-solid fa-heart text-rose-500 scale-125' : 'fa-regular fa-heart text-slate-200';

                    const favoriteButtonHtml = `
                        <button onclick="toggleFavoriteKanka(${car.id}, this)" class="absolute top-3 ${kalpPozisyonu} bg-slate-900/90 hover:bg-slate-800 text-white w-8 h-8 rounded-xl flex items-center justify-center transition shadow-lg z-10" title="Favorilere Ekle">
                            <i class="${kalpIkonClass} text-sm transition-all duration-300"></i>
                        </button>
                    `;

                    const resimYolu = car.image_path 
                        ? `https://arabamiz-projesi.onrender.com${car.image_path}` 
                        : (car.image_url || 'https://via.placeholder.com/400x250');

                    html += `
                        <div class="bg-[#0f172a] rounded-2xl overflow-hidden border border-slate-800 shadow-xl group transition-all duration-300 hover:-translate-y-1.5 relative">
                            
                            ${favoriteButtonHtml}
                            ${deleteButtonHtml}

                            <img src="${resimYolu}" class="w-full h-44 object-cover">
                            <div class="p-4 space-y-3">
                                <div>
                                    <h3 class="font-bold text-lg text-slate-200 group-hover:text-sky-400 transition-colors line-clamp-1">${car.title}</h3>
                                    <div class="flex items-center gap-3 text-xs text-slate-400 mt-1">
                                        <span><i class="fa-solid fa-road"></i> ${Number(car.km).toLocaleString('tr-TR')} km</span>
                                        <span>•</span>
                                        <span><i class="fa-solid fa-gas-pump"></i> ${car.fuel_type}</span>
                                        <span>•</span>
                                        <span><i class="fa-solid fa-calendar"></i> ${car.year}</span>
                                    </div>
                                </div>
                                <div class="pt-3 border-t border-slate-800/80 flex justify-between items-center">
                                    <span class="text-xl font-black text-sky-400">${Number(car.price).toLocaleString('tr-TR')} TL</span>
                                    <a href="detail.html?id=${car.id}" class="bg-sky-600 hover:bg-sky-500 text-white text-xs font-bold px-4 py-2 rounded-xl transition-all text-center">Detayları Gör</a>
                                </div>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
            }
            container.innerHTML = html;
        }
          
        // 4. ALGORİTMA: FİLTRELEME SİTEMİ
        function applyFilters() {
            const brand = document.getElementById('filter-brand').value;
            const kmMax = document.getElementById('filter-km-max').value;
            const priceMax = document.getElementById('filter-price-max').value;
            const fuel = document.getElementById('filter-fuel').value;

            filteredCars = allLiveCars.filter(car => {
                if (brand !== 'all' && car.brand.toLowerCase() !== brand.toLowerCase()) return false;
                if (kmMax && car.km > parseInt(kmMax)) return false;
                if (priceMax && car.price > parseFloat(priceMax)) return false;
                if (fuel !== 'all' && car.fuel_type !== fuel) return false;
                return true;
            });

            navigate('vitrin');
        }

        function clearFilters() {
            document.getElementById('filter-brand').value = 'all';
            document.getElementById('filter-km-max').value = '';
            document.getElementById('filter-price-max').value = '';
            document.getElementById('filter-fuel').value = 'all';
            document.getElementById('search-input').value = '';
            filteredCars = [...allLiveCars];
            navigate('vitrin');
        }

        function handleSearch(val) {
            filteredCars = allLiveCars.filter(car => 
                car.title.toLowerCase().includes(val.toLowerCase()) || 
                car.brand.toLowerCase().includes(val.toLowerCase()) ||
                car.model.toLowerCase().includes(val.toLowerCase())
            );
            navigate('vitrin');
        }

        // Statik Sayfalar
        function renderStaticPages(pageName, container) {
            const userId = localStorage.getItem('user_id');

            const statics = {
                'ilanlarim': `<h2 class="text-xl font-bold mb-4 text-purple-400">Yayındaki İlanlarım</h2><p class="text-xs text-slate-400">Bu alan geliştirme aşamasındadır kanka.</p>`,
                'ayarlar': `
                    <h2 class="text-xl font-bold mb-2 text-blue-400">Sistem ve Profil Ayarları</h2>
                    <p class="text-xs text-slate-400 mb-6">Profilinizi bu alandan yönetebilir veya güncelleyebilirsiniz kanka.</p>
                    
                    <div class="bg-[#0f172a] p-6 rounded-2xl border border-slate-800/80 space-y-4 max-w-md">
                        <h3 class="text-sm font-bold text-rose-500 uppercase tracking-wider flex items-center gap-2">
                            <i class="fa-solid fa-triangle-exclamation"></i> Tehlikeli Bölge
                        </h3>
                        <p class="text-xs text-slate-400 leading-relaxed">
                            Hesabınızı kapattığınızda veritabanındaki tüm profil bilgileriniz ve yayınlamış olduğunuz tüm araç ilanları kalıcı olarak silinecektir. Bu işlem geri alınamaz kanka!
                        </p>
                        <div class="pt-2">
                            <button onclick="deleteAccountAndExit(${userId})" class="px-5 py-3 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs transition shadow-lg shadow-rose-600/10 flex items-center gap-2">
                                <i class="fa-solid fa-user-xmark"></i> Hesabımı Kalıcı Olarak Kapat
                            </button>
                        </div>
                    </div>
                `
            };
            container.innerHTML = statics[pageName] || `<h2>Sayfa Bulunamadı</h2>`;
        }

        // KULLANICI PROFİL MOTORU
        function kullaniciProfiliniOlustur() {
            const aktifKullanici = localStorage.getItem('username') || localStorage.getItem('name_surname') || "Alihan Aydoğdu"; 
            const profilKutusu = document.getElementById('kullanici-profil-alani');
            
            if (profilKutusu) {
                profilKutusu.innerHTML = `
                    <div class="mt-4 mb-6 flex items-center gap-3 bg-white/5 border border-white/10 rounded-2xl p-3 shadow-inner mx-2">
                        <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center text-white shadow-md flex-shrink-0">
                            <i class="fa-solid fa-user text-sm"></i>
                        </div>
                        <div class="flex flex-col truncate">
                            <span class="text-[10px] text-slate-400 font-medium uppercase tracking-wider">Aktif Kullanıcı</span>
                            <span class="text-sm font-bold text-white truncate" title="${aktifKullanici}">${aktifKullanici}</span>
                        </div>
                    </div>
                `;
            }
        }

        // KALBE BASINCA TETİKLENEN FAVORİ KAYIT MOTORU
        function toggleFavoriteKanka(carId, buttonElement) {
            const kalpIkonu = buttonElement.querySelector('i');
            let favoriListesi = JSON.parse(localStorage.getItem('my_favorites')) || [];
            
            if (kalpIkonu.classList.contains('fa-regular')) {
                kalpIkonu.classList.remove('fa-regular', 'text-slate-200');
                kalpIkonu.classList.add('fa-solid', 'text-rose-500', 'scale-125');
                if (!favoriListesi.includes(carId)) favoriListesi.push(carId);
                alert("🌟 İlan favorilerine eklendi kanka!");
            } else {
                kalpIkonu.classList.remove('fa-solid', 'text-rose-500', 'scale-125');
                kalpIkonu.classList.add('fa-regular', 'text-slate-200');
                favoriListesi = favoriListesi.filter(id => id !== carId);
                alert("💔 İlan favorilerinden kaldırıldı kanka!");
            }
            localStorage.setItem('my_favorites', JSON.stringify(favoriListesi));
        }

        // SOL MENÜDEN FAVORİLERİ SÜZEN MOTOR
        function fetchOnlyFavorites(menuElement = null) {
            const favoriListesi = JSON.parse(localStorage.getItem('my_favorites')) || [];
            
            if (favoriListesi.length === 0) {
                alert("🛑 Kanka henüz hiçbir ilana kalp atmamışsın! Önce sevdiklerini favoriye ekle.");
                return;
            }

            filteredCars = allLiveCars.filter(car => favoriListesi.includes(car.id));
            navigate('vitrin', menuElement);
        }

        // İLAN SILME MOTORU
        async function deleteSingleCar(carId) {
            if (!confirm("Kanka bu ilanı vitrinden tamamen kaldırmak istediğine emin misin?")) return;

            try {
                const response = await fetch(`https://arabamiz-projesi.onrender.com${carId}`, { method: 'DELETE' });
                if (response.ok) {
                    alert("🚀 İlan başarıyla veritabanından söküldü kanka!");
                    fetchCarsFromDatabase();
                } else {
                    alert("❌ Silme başarısız.");
                }
            } catch (error) {
                console.error(error);
            }
        }

        // HESAP SİLME MOTORU
        async function deleteAccountAndExit() {
            const userId = localStorage.getItem('user_id') || localStorage.getItem('id');
            if (!userId) return;

            if (!confirm("⚠️ Hesabını ve tüm ilanlarını kalıcı olarak silmek istediğinden emin misin kanka?")) return; 

            try {
                const response = await fetch(`https://arabamiz-projesi.onrender.com${userId}`, { method: 'DELETE' });
                if (response.ok) {
                    alert("🚀 Hesap başarıyla kapatıldı kanka.");
                    localStorage.clear();
                    window.location.href = 'login.html';
                }
            } catch (error) {
                console.error(error);
            }
        }

        // TEMA DEĞİŞTİRİCİ
        let isDark = true;
        function toggleTheme() {
            const body = document.getElementById('app-body');
            isDark = !isDark;
            body.className = isDark ? "bg-[#0f172a] text-slate-200 font-sans transition-colors duration-300" : "bg-slate-100 text-slate-800 font-sans transition-colors duration-300";
        }

        // SAYFA YÜKLENİNCE BAŞLAYAN SUNUCU MOTORU
        document.addEventListener('DOMContentLoaded', () => {
            const currentUserId = localStorage.getItem('user_id') || localStorage.getItem('id');
            
            if (!currentUserId || currentUserId === "undefined" || currentUserId === "null") {
                window.location.href = 'login.html';
            } else {
                fetchCarsFromDatabase();
                kullaniciProfiliniOlustur();
            }
        });

        // GÜVENLİ OTURUMU KAPATMA
        function oturumuKapatKanka() {
            if (!confirm("Oturumu kapatmak istediğine emin misin kanka?")) return;
            localStorage.clear();
            window.location.href = './login.html';
        }
    </script>
</body>
</html>
